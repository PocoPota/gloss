<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>gloss</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- CSP: static hosts (CF Pages, Vercel, Netlify) should also set this as a header via _headers. -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' https://cdn.jsdelivr.net;
             worker-src 'self' blob: https://cdn.jsdelivr.net;
             style-src 'self' https://fonts.googleapis.com;
             font-src 'self' https://fonts.gstatic.com;
             img-src 'self' data:;
             connect-src 'self' https://cdn.jsdelivr.net https://api.anthropic.com https://generativelanguage.googleapis.com https://api.deepl.com https://api-free.deepl.com;
             base-uri 'self';
             object-src 'none';
             form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-family='Georgia,serif' font-size='28' font-style='italic'%3Eg%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <div class="brand" title="gloss — 欄外の翻訳">
      <span class="logo">gloss</span>
      <span class="sub">PDFの選択箇所を、その場で日本語に</span>
    </div>

    <div class="toolbar">
      <label class="file-btn" title="PDFを開く">
        <input type="file" id="file" accept="application/pdf" hidden />
        <span>PDFを開く</span>
      </label>
      <label class="row">
        <span>engine</span>
        <select id="engine"></select>
      </label>
      <label class="row">
        <span>zoom</span>
        <select id="zoom">
          <option value="1.0">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5" selected>150%</option>
          <option value="1.75">175%</option>
          <option value="2.0">200%</option>
        </select>
      </label>
      <span id="doc-meta" class="doc-meta"></span>
      <div class="spacer"></div>
      <button type="button" id="open-settings" class="icon-btn" title="APIキー設定" aria-label="設定">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button type="button" id="clear-history" class="ghost" title="履歴とキャッシュを削除">履歴を消去</button>
    </div>
  </header>

  <!-- Settings modal -->
  <div id="settings-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-labelledby="settings-title" aria-modal="true">
      <div class="modal-head">
        <h3 id="settings-title">APIキー設定</h3>
        <button type="button" class="icon-btn close" id="close-settings" aria-label="閉じる">✕</button>
      </div>

      <div class="modal-section">
        <label class="switch">
          <input type="checkbox" id="save-pref" />
          <span><b>このブラウザにキーを保存する</b></span>
        </label>
        <p class="modal-help">
          OFFの場合、入力したキーは<b>このタブを閉じるかリロードすると消えます</b>。ONにするとブラウザの <code>localStorage</code> に保存され、次回以降も使えます。<br />
          キーはこのドメイン内のJSからのみアクセス可能で、サーバには一切送信されません。APIリクエストは翻訳プロバイダに直接行われます。
        </p>
      </div>

      <form id="settings-form" class="settings-form"></form>

      <div class="modal-foot">
        <span id="settings-status" class="muted"></span>
        <button type="button" id="wipe-all" class="ghost danger">全キー削除</button>
      </div>
    </div>
  </div>

  <main>
    <section id="viewer" class="viewer">
      <div id="drop-hint" class="drop-hint">
        <div class="drop-hint-inner">
          <div class="hero">gloss</div>
          <p>PDFファイルをここにドロップ、または上の <b>PDFを開く</b> から選択してください。</p>
          <p class="hint">読み込み後、本文中をマウスで選択すると右ペインに翻訳が現れます。 <kbd>Esc</kbd> で解除。</p>
        </div>
      </div>
      <div id="pages" class="pages"></div>
    </section>

    <aside id="panel" class="panel">
      <div class="panel-head">
        <h2>Glosses</h2>
        <span id="cache-stat" class="muted"></span>
      </div>
      <div id="current" class="current" aria-live="polite"></div>
      <ol id="history" class="history" reversed></ol>
    </aside>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
